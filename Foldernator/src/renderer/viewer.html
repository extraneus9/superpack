<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: thumb: ficon: data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: thumb: ficon: data: blob:">
  <title>Foldernator viewer</title>
  <style>
    :root { color-scheme: dark; --bg: #0b0b0b; --text: #f2f2f2; --dim: rgba(255,255,255,.55); --hover: rgba(255,255,255,.12); --accent: #e3150f; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 Inter, "Segoe UI Variable", "Segoe UI", sans-serif; overflow: hidden; user-select: none; }
    #app { display: grid; grid-template-rows: 40px minmax(0, 1fr) 46px; height: 100%; }
    /* the bar is the window's title bar: drag it to move the window (Windows' own buttons sit on the right) */
    .bar { display: flex; align-items: center; gap: 10px; padding: 0 150px 0 14px; -webkit-app-region: drag; }
    .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .count { color: var(--dim); font-variant-numeric: tabular-nums; flex: none; }
    button { -webkit-app-region: no-drag; height: 32px; min-width: 32px; padding: 0 8px; border: 0; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--text); background: transparent; cursor: default; font: inherit; }
    button:hover { background: var(--hover); }
    button:disabled { opacity: .25; pointer-events: none; }
    .stage { position: relative; overflow: hidden; min-height: 0; }
    .stage img { position: absolute; left: 50%; top: 50%; max-width: none; transform-origin: 0 0; box-shadow: 0 10px 40px rgba(0,0,0,.5); -webkit-user-drag: none; cursor: grab; will-change: transform; }
    .stage.panning img { cursor: grabbing; }
    .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.08); z-index: 2; }
    .prev { left: 10px; } .next { right: 10px; }
    .tools { display: flex; align-items: center; justify-content: center; gap: 2px; padding: 0 10px; border-top: 1px solid rgba(255,255,255,.06); }
    .tools .sep { width: 1px; height: 20px; background: rgba(255,255,255,.12); margin: 0 6px; }
    .zoomv { min-width: 52px; color: var(--dim); font-variant-numeric: tabular-nums; }
    .info { position: absolute; right: 12px; top: 12px; z-index: 3; background: rgba(20,20,20,.94); border: 1px solid rgba(255,255,255,.08); border-radius: 10px; padding: 12px 14px; min-width: 220px; display: none; line-height: 1.7; }
    .info.on { display: block; }
    .info b { color: var(--dim); font-weight: 400; display: inline-block; min-width: 78px; }
    .toast { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: rgba(20,20,20,.95); padding: 7px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 4; }
    .toast.on { opacity: 1; }
    .menu { position: absolute; bottom: 50px; right: 12px; background: #1a1a1a; border: 1px solid rgba(255,255,255,.1); border-radius: 10px; padding: 4px; display: none; z-index: 5; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
    .menu.on { display: block; }
    .menu button { width: 100%; justify-content: flex-start; padding: 0 12px; }
    /* crop mode */
    .crop { position: absolute; inset: 0; z-index: 3; display: none; }
    body.cropping .crop { display: block; }
    body.cropping .nav, body.cropping .tools [data-act]:not([data-act="crop"]) { display: none; }
    .crop .box { position: absolute; outline: 1px solid #fff; box-shadow: 0 0 0 9999px rgba(0,0,0,.6); cursor: move; }
    .crop .box::before, .crop .box::after { content: ''; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(to right, transparent 33.2%, rgba(255,255,255,.35) 33.3%, transparent 33.5%, transparent 66.5%, rgba(255,255,255,.35) 66.6%, transparent 66.8%),
                  linear-gradient(to bottom, transparent 33.2%, rgba(255,255,255,.35) 33.3%, transparent 33.5%, transparent 66.5%, rgba(255,255,255,.35) 66.6%, transparent 66.8%); }
    .crop .h { position: absolute; width: 14px; height: 14px; background: #fff; border-radius: 3px; transform: translate(-50%, -50%); }
    .crop .h[data-h="nw"] { left: 0; top: 0; cursor: nwse-resize; } .crop .h[data-h="ne"] { left: 100%; top: 0; cursor: nesw-resize; }
    .crop .h[data-h="sw"] { left: 0; top: 100%; cursor: nesw-resize; } .crop .h[data-h="se"] { left: 100%; top: 100%; cursor: nwse-resize; }
    .crop .h[data-h="n"] { left: 50%; top: 0; cursor: ns-resize; } .crop .h[data-h="s"] { left: 50%; top: 100%; cursor: ns-resize; }
    .crop .h[data-h="w"] { left: 0; top: 50%; cursor: ew-resize; } .crop .h[data-h="e"] { left: 100%; top: 50%; cursor: ew-resize; }
    .crop .dims { position: absolute; left: 50%; top: -28px; transform: translateX(-50%); background: rgba(0,0,0,.75); padding: 2px 8px; border-radius: 6px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .cropbar { display: none; align-items: center; gap: 4px; }
    body.cropping .cropbar { display: flex; }
    .cropbar button.on { background: rgba(255,255,255,.16); }
    .cropbar .apply { background: var(--accent); font-weight: 600; padding: 0 14px; }
    .cropbar .apply:hover { background: #ff2a22; }
    /* markup mode (draw / highlight / erase / pixelate / blur) */
    .stage canvas.mk, .stage canvas.mk2 { position: absolute; left: 50%; top: 50%; transform-origin: 0 0; display: none; touch-action: none; }
    .stage canvas.mk2 { pointer-events: none; }
    body.marking .stage canvas.mk, body.marking .stage canvas.mk2 { display: block; }
    body.marking .stage img, body.marking .nav { visibility: hidden; }
    body.marking .stage canvas.mk { cursor: crosshair; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
    body.marking .tools [data-act]:not([data-act="markup"]), body.marking .tools > .sep { display: none; }
    .mkrect { position: absolute; z-index: 4; border: 1.5px dashed #fff; outline: 1px solid rgba(0,0,0,.6); pointer-events: none; display: none; }
    .markbar { display: none; align-items: center; gap: 3px; }
    body.marking .markbar { display: flex; }
    .markbar button.on { background: rgba(255,255,255,.18); }
    .markbar .sw { width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent; cursor: default; flex: none; margin: 0 1px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }
    .markbar .sw.on { border-color: #fff; }
    .markbar input[type=range] { width: 90px; accent-color: var(--accent); }
    .markbar .save { background: var(--accent); font-weight: 600; padding: 0 14px; }
    .markbar .save:hover { background: #ff2a22; }
    .markbar .msep { width: 1px; height: 20px; background: rgba(255,255,255,.12); margin: 0 5px; }
    /* video mode: the player fills the stage; image-only tools step aside */
    .stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; display: none; outline: none; }
    body.video .stage video { display: block; }
    body.video .stage img, body.video .tools [data-act]:not([data-act="delete"]):not([data-act="info"]):not([data-act="more"]), body.video .tools > .sep, body.video .menu [data-act="wallpaper"] { display: none; }
    body.video .nav { top: 40%; }
    svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>
  <div id="app">
    <div class="bar"><div class="name"></div><div class="count"></div></div>
    <div class="stage">
      <img alt="" draggable="false">
      <video controls preload="auto"></video>
      <canvas class="mk"></canvas><canvas class="mk2"></canvas><div class="mkrect"></div>
      <button class="nav prev" title="Previous (←)"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg></button>
      <button class="nav next" title="Next (→)"><svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg></button>
      <div class="info"></div>
      <div class="toast"></div>
      <div class="crop"><div class="box"><div class="dims"></div>
        <i class="h" data-h="nw"></i><i class="h" data-h="n"></i><i class="h" data-h="ne"></i><i class="h" data-h="e"></i>
        <i class="h" data-h="se"></i><i class="h" data-h="s"></i><i class="h" data-h="sw"></i><i class="h" data-h="w"></i></div></div>
      <div class="menu">
        <button data-act="wallpaper">Set as desktop background</button>
        <button data-act="explorer">Show in folder</button>
        <button data-act="openwith">Open in default app</button>
      </div>
    </div>
    <div class="tools">
      <button data-act="zoomout" title="Zoom out (−)"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M5 7h4M10.5 10.5 14 14"/></svg></button>
      <button class="zoomv" data-act="fit" title="Fit to window (0)">100%</button>
      <button data-act="zoomin" title="Zoom in (+)"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M5 7h4M7 5v4M10.5 10.5 14 14"/></svg></button>
      <button data-act="actual" title="Actual size (1)">1:1</button>
      <div class="sep"></div>
      <button data-act="left" title="Rotate left (Ctrl+L)"><svg viewBox="0 0 16 16"><path d="M3 6.5A5.5 5.5 0 1 1 4.6 12M3 2.5v4h4"/></svg></button>
      <button data-act="right" title="Rotate right (Ctrl+R)"><svg viewBox="0 0 16 16"><path d="M13 6.5A5.5 5.5 0 1 0 11.4 12M13 2.5v4H9"/></svg></button>
      <button data-act="flipH" title="Flip horizontal"><svg viewBox="0 0 16 16"><path d="M8 2v12M6 4 2 12h4zM10 4l4 8h-4z"/></svg></button>
      <button data-act="markup" title="Edit: draw, highlight, pixelate, blur (E)"><svg viewBox="0 0 16 16"><path d="M10.5 2.5l3 3L6 13H3v-3z"/><path d="M9 4l3 3"/></svg></button>
      <div class="markbar">
        <button data-tool="pen" title="Pen (P)"><svg viewBox="0 0 16 16"><path d="M10.5 2.5l3 3L6 13H3v-3z"/></svg>Pen</button>
        <button data-tool="hl" title="Highlighter (H)"><svg viewBox="0 0 16 16"><path d="M9 3l4 4-6 6H3v-4z"/><path d="M2 15h8"/></svg>Highlight</button>
        <button data-tool="erase" title="Eraser — brings back the original (X)"><svg viewBox="0 0 16 16"><path d="M6 13h8M3.5 10.5l6-6a1.4 1.4 0 0 1 2 0l1 1a1.4 1.4 0 0 1 0 2l-5.5 5.5H5z"/></svg>Erase</button>
        <button data-tool="pixel" title="Pixelate an area — drag a box (Z)"><svg viewBox="0 0 16 16"><path d="M2 2h4v4H2zM10 2h4v4h-4zM6 6h4v4H6zM2 10h4v4H2zM10 10h4v4h-4z"/></svg>Pixelate</button>
        <button data-tool="blur" title="Blur an area — drag a box (B)"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" stroke-dasharray="2 2"/><circle cx="8" cy="8" r="2.5"/></svg>Blur</button>
        <div class="msep"></div>
        <i class="sw" data-color="#e3150f" style="background:#e3150f"></i><i class="sw" data-color="#ffffff" style="background:#fff"></i><i class="sw" data-color="#111111" style="background:#111"></i><i class="sw" data-color="#ffd400" style="background:#ffd400"></i><i class="sw" data-color="#2f7bff" style="background:#2f7bff"></i><i class="sw" data-color="#16a765" style="background:#16a765"></i>
        <input class="size" type="range" min="1" max="40" value="6" title="Brush / effect size">
        <div class="msep"></div>
        <button class="undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 16 16"><path d="M5 3 2 6l3 3M2.5 6H10a4 4 0 0 1 0 8H7"/></svg></button>
        <button class="mcancel">Cancel</button><button class="mcopy" title="Keep the original and save a new file">Save as copy</button><button class="save" title="Replace the file (Ctrl+S)">Save</button>
      </div>
      <button data-act="crop" title="Crop (C)"><svg viewBox="0 0 16 16"><path d="M4 1.5V12h10.5M1.5 4H12v10.5"/></svg></button>
      <div class="cropbar">
        <button data-ar="free" class="on">Free</button><button data-ar="orig">Original</button><button data-ar="1">1:1</button>
        <button data-ar="0.8">4:5</button><button data-ar="0.5625">9:16</button><button data-ar="1.7778">16:9</button>
        <div class="sep"></div><button class="cancel">Cancel</button><button class="apply">Save crop</button>
      </div>
      <button data-act="flipV" title="Flip vertical"><svg viewBox="0 0 16 16"><path d="M2 8h12M4 6l8-4v4zM4 10l8 4v-4z"/></svg></button>
      <div class="sep"></div>
      <button data-act="copy" title="Copy image (Ctrl+C)"><svg viewBox="0 0 16 16"><rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"/></svg></button>
      <button data-act="delete" title="Delete (Del)"><svg viewBox="0 0 16 16"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.6a1 1 0 0 0 1 .9h3.8a1 1 0 0 0 1-.9l.6-8.6"/></svg></button>
      <button data-act="info" title="File info (I)"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 7.5V11M8 5h.01"/></svg></button>
      <button data-act="more" title="More"><svg viewBox="0 0 16 16"><path d="M3.5 8h.01M8 8h.01M12.5 8h.01"/></svg></button>
    </div>
  </div>
  <script type="module" src="js/viewer-page.js"></script>
</body>
</html>
