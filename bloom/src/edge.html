<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<style>
/* Edge Light: the whole screen edge lights up in the sender's colour, a light runs around it twice, then fades. */
@property --a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
.edge { --c: #e0312b; --c2: var(--c); --c3: var(--c); --c4: var(--c); position: absolute; inset: 0; opacity: 0; box-shadow: inset 0 0 46px -6px var(--c); }
.edge .ring { position: absolute; inset: 0; padding: 4px; animation: spin 1.1s linear infinite;
  background: conic-gradient(from var(--a), transparent 0deg, transparent 130deg, var(--c) 200deg, var(--c2) 245deg, #fff 290deg, var(--c3) 315deg, var(--c4) 340deg, transparent 360deg);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite: exclude; filter: drop-shadow(0 0 8px var(--c)); }
.edge.on { animation: flash 2.6s ease-in-out forwards; }
@keyframes flash { 0% { opacity: 0; } 15% { opacity: 1; } 45% { opacity: .45; } 65% { opacity: 1; } 100% { opacity: 0; } }
@keyframes spin { to { --a: 360deg; } }
</style>
</head>
<body><div class="edge" id="edge"><div class="ring"></div></div><script src="edge.js"></script></body>
</html>
